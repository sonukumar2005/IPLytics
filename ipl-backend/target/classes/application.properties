spring.application.name=ipl-backend

# ── H2 In-Memory Database ──
spring.datasource.url=jdbc:h2:mem:ipldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA ──
# create-drop: rebuilds schema on each restart → ensures fresh data from CSV
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Server ──
server.port=8080

# ── CORS (open for local dev) ──
cors.allowed-origins=http://localhost:5173

# ── Logging ──
logging.level.com.ipl=INFO
logging.level.org.springframework.web=WARN
